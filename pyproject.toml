[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dailymail"
version = "0.1.0"
description = "Queue-driven personal news digest"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "boto3",
    "feedparser",
    "google-genai",
    "instructor>=1.11.3",
    "jinja2",
    "openai",
    "pydantic",
    "python-dateutil",
    "requests",
    "unstructured",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "dailymail_shared",
    "digest",
    "rss_reader",
    "scraper",
    "summarizer",
]